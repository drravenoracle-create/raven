name: Render Reel

on:
  workflow_dispatch:
    inputs:
      input_key:
        description: "R2 input object key"
        required: true
        type: string
      output_key:
        description: "R2 output object key"
        required: true
        type: string
      title:
        description: "Main telop text"
        required: true
        type: string
      subtitle:
        description: "Sub telop text"
        required: true
        type: string
      brand:
        description: "Brand footer text"
        required: false
        default: "Raven Blackwood"
        type: string
      cta:
        description: "Final call-to-action text"
        required: false
        default: "詳しい鑑定はプロフィールから"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: raven-oracle-media
      INPUT_KEY: ${{ inputs.input_key }}
      OUTPUT_KEY: ${{ inputs.output_key }}
      REEL_TITLE: ${{ inputs.title }}
      REEL_SUBTITLE: ${{ inputs.subtitle }}
      REEL_BRAND: ${{ inputs.brand }}
      REEL_CTA: ${{ inputs.cta }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk unzip
          if ! command -v aws >/dev/null 2>&1; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
          fi
          aws --version

      - name: Download source from R2
        run: |
          aws s3 cp "s3://$R2_BUCKET/$INPUT_KEY" input.mp4 --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Render telop reel
        run: |
          node scripts/render-reel.mjs \
            --input input.mp4 \
            --output output.mp4 \
            --title "$REEL_TITLE" \
            --subtitle "$REEL_SUBTITLE" \
            --brand "$REEL_BRAND" \
            --cta "$REEL_CTA"

      - name: Upload rendered reel to R2
        run: |
          aws s3 cp output.mp4 "s3://$R2_BUCKET/$OUTPUT_KEY" --content-type video/mp4 --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Summary
        run: |
          echo "Rendered Reel uploaded to R2:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$OUTPUT_KEY\`" >> "$GITHUB_STEP_SUMMARY"
