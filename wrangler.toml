name = "raven-oracle"
main = "dist/server/index.js"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]
account_id = "c7ce2613bf30affed8d2caae0068beb5"
workers_dev = true
preview_urls = false

routes = [
  { pattern = "raven.fortunestudios.jp/*", zone_name = "fortunestudios.jp" }
]

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "raven-oracle"
database_id = "b5d2b96a-c574-47fa-b582-1063b05595bd"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "raven-oracle-media"

[triggers]
crons = ["*/15 * * * *"]

[vars]
GA4_PROPERTY_ID = "546077100"
GOOGLE_SERVICE_ACCOUNT_EMAIL = "fortune-studio-analytics@raven-502815.iam.gserviceaccount.com"
SEARCH_CONSOLE_SITE_URL = "https://raven.fortunestudios.jp/"
