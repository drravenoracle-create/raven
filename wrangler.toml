name = "raven-oracle"
main = "dist/server/index.js"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]
account_id = "c7ce2613bf30affed8d2caae0068beb5"
workers_dev = true
preview_urls = false

routes = [
  { pattern = "raven.fortunestudios.jp/*", zone_name = "fortunestudios.jp" }
]

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "raven-oracle"
database_id = "b5d2b96a-c574-47fa-b582-1063b05595bd"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "raven-oracle-media"

[triggers]
crons = ["*/15 * * * *"]

[vars]
GA4_PROPERTY_ID = "546077100"
GOOGLE_SERVICE_ACCOUNT_EMAIL = "fortune-studio-analytics@raven-502815.iam.gserviceaccount.com"
SEARCH_CONSOLE_SITE_URL = "https://raven.fortunestudios.jp/"
MEMBER_SYSTEM_ENABLED = "true"
TRIAL_ENABLED = "true"
READING_HISTORY_ENABLED = "true"
CROSS_CHARACTER_ACCESS_ENABLED = "true"
GUILD_MEMBER_API_BASE_URL = "https://guild-member-core.fortune-kanri.workers.dev"
SNS_DAILY_THREE_CHOICE_ENABLED = "true"
SNS_DAILY_THREE_CHOICE_TIME_JST = "07:00"
SNS_DAILY_THREE_CHOICE_GENERATION_LEAD_MINUTES = "60"
VIDEO_RENDERER_URL = "https://raven-ffmpeg-renderer-205731737764.asia-northeast1.run.app"
INSTAGRAM_TOKEN_EXPIRES_AT = "2026-10-17"
INSTAGRAM_TOKEN_RENEWAL_TARGET_AT = "2026-10-10"
